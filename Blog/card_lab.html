<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Outfit:wght@500;700;800&display=swap">
<style>
/* The Lantern look (docs/client-design.md), as in the card generation and GNN visualisers: smoked glass over the
   forest, Lantern for what's on and kept, Firefly for the one you picked, coral for what was thrown away. */
:root {
  --shadow: #06100D; --night: #0B1612; --glass: #091310; --lantern: #7EF0D8; --text: #E6FBF4;
  --gold: #F4C76B; --muted: #A9C9BC; --parchment: #4A3726; --ink: #1C1209; --coral: #FF6A5C; --down: #FF8A96;
  --rim: rgba(160, 235, 215, .3); --pane: rgba(9, 19, 16, .8);
}
* { box-sizing: border-box; }
html { background: #050C0A; }
body { margin: 0; min-height: 100vh; color: var(--text); font: 500 15px/1.45 Outfit, system-ui, sans-serif; }
button, input { font: inherit; color: inherit; }
#bg { position: fixed; inset: -30px; z-index: -1; background: var(--night) center / cover no-repeat; filter: blur(7px) brightness(.32) saturate(.85); }
#bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 40% 30%, rgba(11, 22, 18, .1) 0%, rgba(5, 12, 10, .8) 100%); }
.wrap { max-width: 1320px; margin: 0 auto; padding: 40px 16px 80px; }

header { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between; }
h1 { font: 400 54px/1 "Marcellus SC", serif; margin: 0; text-shadow: 0 3px 10px var(--shadow); }
.sub { color: var(--muted); margin: 14px 0 0; max-width: 680px; font-size: 18px; line-height: 1.4; }
.crumbs { font: 700 12px Outfit; color: var(--lantern); letter-spacing: .12em; text-transform: uppercase; opacity: .85; }

.panel { background: var(--pane); border: 1.5px solid var(--rim); border-radius: 14px; backdrop-filter: blur(6px); }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 14px 16px; }
.controls label { display: flex; flex-direction: column; gap: 5px; }
.controls input { width: 84px; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--rim); background: var(--glass);
  font-weight: 700; font-variant-numeric: tabular-nums; outline: none; }
.controls input:focus { border-color: var(--lantern); }
.btn { font: 400 16px "Marcellus SC", serif; background: var(--glass); color: var(--lantern); border: 1.5px solid var(--lantern);
  border-radius: 999px; padding: 6px 18px; cursor: pointer; }
.btn.primary { border-width: 2px; color: var(--text); background: color-mix(in srgb, var(--lantern) 12%, var(--glass)); }
.btn.quiet { color: var(--muted); border-color: var(--rim); }
.btn:active { background: rgba(126, 240, 216, .18); transform: scale(.95); }
.note { font-size: 14px; color: var(--muted); margin: 18px 0 0; }

.funnel { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 14px; align-items: stretch; }
.stage { flex: 1 1 140px; padding: 12px 14px; cursor: pointer; text-align: left; transition: border-color .15s, box-shadow .15s; }
.stage .n { font: 800 36px/1.05 Outfit; font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px var(--shadow); }
.stage .s { font: 400 18px "Marcellus SC", serif; margin-top: 4px; }
.stage .l { font-size: 13px; color: var(--muted); line-height: 1.3; }
.stage.drop .n { color: var(--coral); }
.stage.kept { cursor: default; border-color: color-mix(in srgb, var(--lantern) 55%, transparent); }
.stage.kept .n { color: var(--lantern); }
.stage[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 16px rgba(244, 199, 107, .35); }
.reasons { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 14px; align-items: center; font-size: 14px;
  margin: 0 0 30px; padding: 14px 16px; }
.reasons .crumbs { grid-column: 1 / -1; margin-bottom: 2px; }
.reasons .num { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--down); }
.bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255, 106, 92, .55), var(--coral)); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 26px; }
.chip { padding: 5px 16px; border-radius: 999px; border: 1.5px solid rgba(126, 240, 216, .35); background: var(--pane);
  font: 400 16px "Marcellus SC", serif; color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--lantern); color: var(--text); box-shadow: 0 0 14px rgba(126, 240, 216, .4); }
.toolbar .gap { width: 14px; }
.search { flex: 1 1 200px; padding: 7px 16px; border-radius: 999px; border: 1.5px solid var(--rim); background: var(--pane); outline: none; }
.search:focus { border-color: var(--lantern); }
.search::placeholder { color: var(--muted); opacity: .7; }

/* Kept cards, drawn like the client's (painted_card.html). The frame spills past the card, so slots leave room. */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 30px 12px; justify-items: center; }
.slot { display: block; padding: 16px 0 10px; border: 0; background: none; cursor: pointer; transition: transform .14s; }
.slot .pcard { --w: 200px; }
.slot:hover { transform: translateY(-6px); }
.slot:hover .frame { filter: drop-shadow(0 0 8px rgba(244, 199, 107, .85)) drop-shadow(0 calc(var(--u) * 4) 0 rgba(5, 10, 8, .5)); }
.pcard .ph { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, var(--aspect) 0%,
  color-mix(in srgb, var(--aspect) 30%, var(--night)) 75%); }
.pcard .ph svg { position: absolute; left: 50%; bottom: 22%; width: 72%; transform: translateX(-50%); }
.empty { color: var(--muted); padding: 30px 0; }

/* Thrown-away draws. */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 104px 1fr; gap: 14px; padding: 12px 16px; cursor: pointer; text-align: left; transition: border-color .15s; }
.row:hover { border-color: var(--lantern); }
.tag { justify-self: start; align-self: start; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--coral);
  font: 700 11px Outfit; letter-spacing: .1em; text-transform: uppercase; color: var(--coral); background: rgba(255, 106, 92, .08); }
.tag.variety, .tag.duplicate { border-color: var(--gold); color: var(--gold); background: rgba(244, 199, 107, .08); }
.row .why { color: var(--down); font-size: 14px; }
.meta { color: var(--muted); font-size: 13px; }

/* Detail drawer. */
.scrim { position: fixed; inset: 0; background: rgba(5, 12, 10, .6); opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: rgba(9, 19, 16, .92); backdrop-filter: blur(14px);
  border-left: 1.5px solid var(--rim); transform: translateX(100%); transition: transform .2s; overflow-y: auto; padding: 26px 24px 48px; }
.drawer.open { transform: none; }
.drawer .close { position: absolute; right: 18px; top: 20px; padding: 4px 14px; }
.drawer h2 { font: 400 32px/1.1 "Marcellus SC", serif; margin: 0 70px 4px 0; text-shadow: 0 2px 8px var(--shadow); }
.drawer .subtitle { color: var(--muted); font-style: italic; font-size: 17px; }
.drawer h3 { margin: 28px 0 10px; font-size: 13px; }
.drawer .hero { display: flex; justify-content: center; padding: 34px 0 18px; }
.drawer .hero .pcard { --w: 300px; }
.verdict { display: inline-block; margin-top: 10px; padding: 3px 12px; border-radius: 999px; border: 1.5px solid var(--lantern); color: var(--lantern);
  font: 700 12px Outfit; letter-spacing: .1em; text-transform: uppercase; }
.verdict.out { border-color: var(--coral); color: var(--coral); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { padding: 8px 14px; border-radius: 12px; background: var(--pane); border: 1.5px solid rgba(126, 240, 216, .35); }
.checks li::before { margin-right: 8px; font-weight: 800; }
.checks .ok::before { content: "✓"; color: var(--lantern); }
.checks .no { border-color: rgba(255, 106, 92, .6); }
.checks .no::before { content: "✗"; color: var(--coral); }
.checks .skip { color: var(--muted); border-color: var(--rim); border-style: dashed; }
.checks .skip::before { content: "·"; }
.checks small { display: block; color: var(--down); font-size: 13px; margin-top: 2px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; }
pre { background: rgba(6, 16, 13, .9); border: 1.5px solid var(--rim); border-radius: 12px; padding: 12px 14px; margin: 0; overflow-x: auto;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #BFE9DC; }
.say { background: var(--pane); border: 1.5px solid var(--rim); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.drawer p.meta { margin: 0 0 8px; }

@media (max-width: 600px) {
  h1 { font-size: 40px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 22px 8px; }
  .slot .pcard { --w: 150px; }
  .drawer .hero .pcard { --w: 240px; }
  .row { grid-template-columns: 1fr; gap: 6px; }
}
</style>
</head>
<body>
<div id="bg"></div>
<!--LAB_DATA-->
<div class="wrap">
  <header>
    <div>
      <h1>Card Lab</h1>
      <p class="sub">Cards generated from scratch by an ability grammar: no example cards, no hand-picked templates.
        Each draw goes through the grammar, the quality tests and costing; see what was kept, what was thrown away, and why.</p>
    </div>
    <form class="controls panel" id="controls">
      <label><span class="crumbs">Seed</span><input name="seed" type="number" min="0"></label>
      <label><span class="crumbs">Cards</span><input name="count" type="number" min="1" max="500"></label>
      <label><span class="crumbs">Jobs</span><input name="jobs" type="number" min="1" max="20"></label>
      <label><span class="crumbs">Vanilla</span><input name="vanilla_share" type="number" min="0" max="1" step="0.01"></label>
      <label><span class="crumbs">Keywords</span><input name="keyword_share" type="number" min="0" max="1" step="0.05"></label>
      <label><span class="crumbs">Actions</span><input name="action_share" type="number" min="0" max="1" step="0.05"></label>
      <label><span class="crumbs">Variety</span><input name="variety" type="number" min="1" max="16"></label>
      <button class="btn primary" type="submit">Generate</button>
      <button class="btn quiet" type="button" id="reroll">New seed</button>
    </form>
  </header>
  <p class="note" id="status"></p>

  <div class="funnel" id="funnel"></div>
  <div class="reasons panel" id="reasons"></div>

  <div class="toolbar" id="toolbar">
    <button class="chip" data-view="kept" aria-pressed="true">Kept cards</button>
    <button class="chip" data-view="stopped" aria-pressed="false">Thrown away</button>
    <span class="gap"></span>
    <button class="chip" data-kind="" aria-pressed="true">All</button>
    <button class="chip" data-kind="triggered" aria-pressed="false">Triggered</button>
    <button class="chip" data-kind="static" aria-pressed="false">Static</button>
    <button class="chip" data-kind="on_resolve" aria-pressed="false">Actions</button>
    <button class="chip" data-kind="keywords" aria-pressed="false">Keyword-only</button>
    <button class="chip" data-kind="vanilla" aria-pressed="false">Vanilla</button>
    <input class="search" id="search" type="search" placeholder="Search names and card text…">
  </div>
  <div id="results"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="btn quiet close" id="close" type="button">✕</button>
  <div id="detail"></div>
</aside>

<!--CARD_KIT-->
<!--PAINTED_CARD-->
<!--CARD_ART-->
<script>
const STAGE_TEXT = {
  grammar: ["Grammar", "illegal trees"], quality: ["Quality", "complex, narrow, unconnected or fake choices"],
  card: ["Card", "couldn't matter, doesn't fit or too weak"], duplicate: ["Duplicate", "same stats as a card in the set"],
  variety: ["Variety", "too similar to earlier cards"],
};
const TEST_TEXT = {
  grammar: "Illegal under the grammar", complexity: "Too complex", narrowing: "Too narrow", connected: "Steps not connected",
  dominated: "Dominated choose-one option", card: "Couldn't matter, doesn't fit or too weak", variety: "Too similar to earlier cards",
  duplicate: "Duplicate stats",
};
const KIND_TEXT = { triggered: "Triggered ability", static: "Static ability",
  on_resolve: "Action", vanilla: "Vanilla", keywords: "Keyword-only" };
const ASPECT_COLOURS = { aspect_1: "#F0533A", aspect_2: "#2F86E8", aspect_3: "#43B04F", aspect_4: "#F5B52E", aspect_5: "#9152E0", aspect_6: "#22BCC9" };
const NEUTRAL_COLOUR = "#8A93AD";  // cards any deck can use

const state = { data: null, view: "kept", kind: "", stage: "", search: "", selected: null };
const $ = (id) => document.getElementById(id);

function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

function mushroom(name, colour) {
  // Placeholder art, like the client's silhouettes: cap shape and spots vary with the name, so a card always looks the same.
  const h = hash(name), w = 30 + (h % 9), top = 6 + ((h >> 4) % 10), spots = [];
  for (let i = 0; i < 2 + ((h >> 8) % 3); i++) {
    const x = 50 + (((h >> (10 + i * 3)) % 9) - 4) * 6, y = 22 + ((h >> (12 + i * 2)) % 3) * 7;
    spots.push(`<ellipse cx="${x}" cy="${y}" rx="${4 + ((h >> i) % 3)}" ry="3.2" fill="#FFF8EC" opacity=".92"/>`);
  }
  return `<div class="ph" style="--aspect:${colour}"><svg viewBox="0 0 100 80" aria-hidden="true">
    <ellipse cx="50" cy="75" rx="26" ry="4.5" fill="rgba(0,0,0,.3)"/>
    <path d="M41 44 Q38 64 35 74 L65 74 Q62 64 59 44 Z" fill="#F7EBD8" stroke="#06100D" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="45" cy="58" rx="2.2" ry="3.4" fill="#06100D"/><ellipse cx="55" cy="58" rx="2.2" ry="3.4" fill="#06100D"/>
    <path d="M${50 - w - 6} 47 Q${50 - w} ${top} 50 ${top} Q${50 + w} ${top} ${50 + w + 6} 47 Q50 55 ${50 - w - 6} 47 Z"
      fill="color-mix(in srgb, var(--aspect) 80%, #fff)" stroke="#06100D" stroke-width="3" stroke-linejoin="round"/>
    ${spots.join("")}</svg></div>`;
}

function cardHtml(a) {
  const c = a.card;
  return paintedCard({ ...c, text: a.text, art: true, placeholder: mushroom(c.name, ASPECT_COLOURS[c.aspect] || NEUTRAL_COLOUR) },
    a.kind, c.art);
}

function fitAll(root) { root.querySelectorAll(".pcard").forEach((el) => fitPainted(el.parentElement)); }

function firstFailure(a) { return a.checks.find((c) => c.problems.length); }

function renderSummary() {
  const d = state.data, atts = d.attempts, kept = new Set(d.kept);
  const by = (s) => atts.filter((a) => a.stopped_at === s).length;
  let html = `<button class="stage panel" data-stage="" aria-pressed="${state.stage === ""}"><div class="n">${atts.length}</div>
    <div class="s">Draws</div><div class="l">from the grammar</div></button>`;
  for (const s of d.stages) {
    html += `<button class="stage panel drop" data-stage="${s}" aria-pressed="${state.stage === s}"><div class="n">${by(s) ? "−" + by(s) : 0}</div>
      <div class="s">${STAGE_TEXT[s][0]}</div><div class="l">${STAGE_TEXT[s][1]}</div></button>`;
  }
  html += `<div class="stage panel kept"><div class="n">${kept.size}</div><div class="s">Kept</div><div class="l">cards in the set</div></div>`;
  $("funnel").innerHTML = html;

  const counts = {};
  for (const a of atts) if (a.stopped_at) { const f = firstFailure(a); const k = f ? f.test : a.stopped_at; counts[k] = (counts[k] || 0) + 1; }
  const rows = Object.entries(counts).sort((x, y) => y[1] - x[1]);
  const max = Math.max(1, ...rows.map((r) => r[1]));
  $("reasons").innerHTML = `<div class="crumbs">Why draws were thrown away</div>` + rows.map(([k, n]) =>
    `<span>${TEST_TEXT[k] || k}</span><div class="bar" style="width:${(100 * n) / max}%"></div><span class="num">${n}</span>`).join("");
  const p = d.params;
  $("status").textContent = `Seed ${p.seed} · ${p.count} cards · jobs: ${d.job_list.join(", ")} · ` +
    `complexity budget ${d.max_complexity} nodes (+2 for actions) · variety: best of ${p.variety}` + (window.LAB_DATA ? " · saved snapshot" : "");
}

function visible() {
  const d = state.data, q = state.search.toLowerCase();
  const pool = state.view === "kept" ? d.kept.map((i) => d.attempts[i]) : d.attempts.filter((a) => a.stopped_at && (!state.stage || a.stopped_at === state.stage));
  return pool.filter((a) => (!state.kind || a.kind === state.kind) &&
    (!q || a.text.toLowerCase().includes(q) || (a.card && (a.card.name + " " + a.card.subtitle).toLowerCase().includes(q))));
}

function renderResults() {
  const items = visible(), out = $("results");
  if (!items.length) { out.innerHTML = `<p class="empty">Nothing matches.</p>`; return; }
  if (state.view === "kept") {
    out.innerHTML = `<div class="grid">${items.map((a) =>
      `<button class="slot" data-i="${a.index}" title="${esc(a.card.subtitle ? a.card.name + " – " + a.card.subtitle : a.card.name)}">${cardHtml(a)}</button>`).join("")}</div>`;
    fitAll(out);
  } else {
    out.innerHTML = `<div class="list">${items.map((a) => {
      const f = firstFailure(a);
      return `<button class="row panel" data-i="${a.index}"><span class="tag ${a.stopped_at}">${a.stopped_at}</span>
        <div><div>${esc(a.text || (a.card ? `${a.card.cost} mana ${a.card.power}/${a.card.health} ${a.card.keywords.join(", ")}` : ""))}</div><div class="why">${esc((f ? f.problems : a.problems).join("; "))}</div>
        <div class="meta">${KIND_TEXT[a.kind]}${a.tree ? ` · ${a.complexity} nodes` : ""}</div></div></button>`;
    }).join("")}</div>`;
  }
}

function renderDetail(i) {
  const a = state.data.attempts[i], c = a.card;
  const verdict = a.stopped_at ? `Thrown away at the ${a.stopped_at} stage` : "Kept";
  let checks = "", stopped = false;
  for (const ch of a.checks) {
    const bad = ch.problems.length > 0;
    checks += `<li class="${stopped ? "skip" : bad ? "no" : "ok"}">${esc(ch.name)}${bad ? ch.problems.map((p) => `<small>${esc(p)}</small>`).join("") : ""}</li>`;
    if (bad && ch.test === "grammar") stopped = true;
  }
  if (!a.checks.some((ch) => ch.test === "card")) checks += `<li class="skip">Card building and costing: not reached</li>`;
  const costing = c ? `<dl class="kv">
      <dt>Card type</dt><dd>${c.type}${c.archetype ? ` (${c.archetype})` : ""}</dd>
      ${a.tree ? `<dt>Ability price</dt><dd>${a.value} budget points (measured prices, from costing.py)</dd>` : ""}
      <dt>Cost</dt><dd>${c.cost} mana</dd>
      ${c.type === "unit" ? `<dt>Stats</dt><dd>${c.power} power · ${c.health} health</dd>` : ""}
      ${c.keywords.length ? `<dt>Keywords</dt><dd>${c.keywords.map(esc).join(", ")}</dd>` : ""}
      <dt>Aspect</dt><dd>${c.aspect_name}</dd>
      <dt>Art</dt><dd>${window.CARD_IMAGES[c.art] ? "painted" : "placeholder (no art painted yet)"}</dd></dl>`
    : `<p class="meta">Not reached: the card is only built once the ability passes the tests.</p>`;
  $("detail").innerHTML = `
    <h2>${esc(c ? c.name : "Draw #" + a.index)}</h2>${c && c.subtitle ? `<div class="subtitle">${esc(c.subtitle)}</div>` : ""}
    <span class="verdict ${a.stopped_at ? "out" : ""}">${verdict}</span>
    <div class="meta" style="margin-top:8px">Draw #${a.index} · ${KIND_TEXT[a.kind]}${a.tree ? ` · ${a.complexity} nodes` : ""}</div>
    ${c ? `<div class="hero">${cardHtml(a)}</div>` : `<h3 class="crumbs">Card text</h3><div class="say">${esc(a.text)}</div>`}
    <h3 class="crumbs">Pipeline</h3><ul class="checks">${checks}</ul>
    <h3 class="crumbs">Costing</h3>${costing}
    ${a.tree ? `<h3 class="crumbs">Ability tree</h3><pre>${esc(JSON.stringify(a.tree, null, 2))}</pre>
    <h3 class="crumbs">Shape</h3><p class="meta">The tree with numbers and jobs blanked out. The variety stage counts these.</p><pre>${esc(JSON.stringify(JSON.parse(a.shape)))}</pre>` : ""}`;
  $("drawer").classList.add("open"); $("scrim").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false");
  $("drawer").scrollTop = 0;
  fitAll($("detail"));
}

function closeDetail() { $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); }

function render() { renderSummary(); renderResults(); syncChips(); }

function syncChips() {
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  document.querySelectorAll("[data-kind]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === state.kind));
}

function params() { return Object.fromEntries(new FormData($("controls"))); }

function fillForm(p) { for (const [k, v] of Object.entries(p)) { const el = $("controls").elements[k]; if (el) el.value = v; } }

async function generate() {
  const p = params();
  $("status").textContent = "Generating…";
  history.replaceState(null, "", "#" + new URLSearchParams(p));
  const res = await fetch("/api/generate?" + new URLSearchParams(p));
  const data = await res.json();
  if (data.error) { $("status").textContent = data.error; return; }
  state.data = data; render();
}

$("bg").style.backgroundImage = `url(${window.CARD_ART.background})`;
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-view],[data-kind],[data-stage],[data-i]");
  if (!t || $("drawer").contains(t)) return;
  if (t.dataset.view) { state.view = t.dataset.view; if (state.view === "kept") state.stage = ""; }
  else if (t.dataset.kind !== undefined) state.kind = t.dataset.kind;
  else if (t.dataset.stage !== undefined) { state.stage = t.dataset.stage; state.view = t.dataset.stage ? "stopped" : "kept"; }
  else { renderDetail(+t.dataset.i); return; }
  render();
});
// Fonts can finish loading after the first render, which changes how much text fits.
document.fonts.addEventListener("loadingdone", () => fitAll(document));
$("search").addEventListener("input", (e) => { state.search = e.target.value; renderResults(); });
$("close").addEventListener("click", closeDetail);
$("scrim").addEventListener("click", closeDetail);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

if (window.LAB_DATA) {
  state.data = window.LAB_DATA;
  $("controls").style.display = "none";
  document.fonts.ready.then(render);
} else {
  fillForm({ seed: 0, count: 60, jobs: 6, vanilla_share: 0.04, keyword_share: 0.25, action_share: 0.25, variety: 4, ...Object.fromEntries(new URLSearchParams(location.hash.slice(1))) });
  $("controls").addEventListener("submit", (e) => { e.preventDefault(); generate(); });
  $("reroll").addEventListener("click", () => { $("controls").elements.seed.value = Math.floor(Math.random() * 100000); generate(); });
  document.fonts.ready.then(generate);
}
</script>
</body>
</html>
