<!-- The card lab's card (card_lab.html); the visualiser uses its text helpers. card_lab.py inlines
     this where a page says CARD_KIT. -->
<style>
/* The card: same design as the Unity client (docs/client-design.md). */
.card { --w: 168px; width: var(--w); height: calc(var(--w) * 1.4); position: relative; border-radius: 14px; background: var(--panel);
  border: 3px solid var(--outline); box-shadow: 0 5px 0 var(--outline); cursor: pointer; transition: transform .12s; font-size: calc(var(--w) / 168 * 10px); }
.card:hover { transform: translateY(-4px); }
.card .art { position: absolute; left: 5%; right: 5%; top: 4%; height: 37%; border-radius: 9px; overflow: hidden;
  background: radial-gradient(circle at 50% 62%, var(--aspect) 0%, color-mix(in srgb, var(--aspect) 35%, var(--panel)) 72%); }
.card .art svg { position: absolute; left: 50%; bottom: 10%; width: 62%; transform: translateX(-50%); }
.card .gem { position: absolute; left: -7%; top: -4%; width: 25%; aspect-ratio: .9; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  background: var(--outline); display: grid; place-items: center; }
.card .gem::before { content: ""; position: absolute; inset: 9%; clip-path: inherit; background: var(--rim); }
.card .gem::after { content: ""; position: absolute; inset: 19%; clip-path: inherit; background: var(--energy); }
.card .gem span { position: relative; z-index: 1; font: 400 2.2em/1 "Lilita One"; color: #fff; text-shadow: 0 0 2px var(--outline), 0 2px 0 var(--outline); }
.card .banner { position: absolute; left: 2%; right: 2%; top: 35.5%; padding: .35em .3em; border-radius: 7px; background: var(--aspect); border: 2px solid var(--outline);
  font: 400 1.3em/1.05 "Lilita One"; text-align: center; color: #fff; text-shadow: 0 1.5px 0 var(--outline); white-space: nowrap; overflow: hidden; }
.card .banner small { display: block; font: italic 800 .82em/1.1 Nunito; text-shadow: none; color: rgba(255, 255, 255, .92); white-space: nowrap; overflow: hidden; }
.card .banner:has(small) { top: 33.5%; padding: .2em .3em .25em; }
.card .banner:has(small) ~ .textbox { top: 52.5%; }
.card .textbox { position: absolute; left: 5%; right: 5%; top: 47.5%; bottom: 12%; border-radius: 8px; background: var(--light); color: var(--outline);
  padding: .35em .5em; display: flex; flex-direction: column; justify-content: safe center; text-align: center; font: 700 1.1em/1.22 Nunito; overflow: hidden; }
.card .textbox b { font-weight: 900; }
.card .trait { position: absolute; left: 50%; bottom: 2.5%; transform: translateX(-50%); background: var(--outline); color: #C7D2F0; border-radius: 6px; padding: .1em .6em; font-size: .95em; }
.card .stat { position: absolute; bottom: -4%; width: 24%; aspect-ratio: 1; display: grid; place-items: center; font: 400 2.1em/1 "Lilita One"; color: #fff;
  text-shadow: 0 0 2px var(--outline), 0 2px 0 var(--outline); }
.card .stat svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .stat span { position: relative; }
.card .power { left: -4%; }
.card .health { right: -4%; }
.card.action .textbox { bottom: 9%; }
.card.stopped { opacity: .55; }
</style>
<script>
const ASPECT_COLOURS = { aspect_1: "#F0533A", aspect_2: "#2F86E8", aspect_3: "#43B04F", aspect_4: "#F5B52E", aspect_5: "#9152E0", aspect_6: "#22BCC9" };
const NEUTRAL_COLOUR = "#8A93AD";  // cards any deck can use
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

function mushroom(name) {
  // Cap shape and spots vary with the name, so the same card always looks the same.
  const h = hash(name), w = 30 + (h % 9), top = 6 + ((h >> 4) % 10), spots = [];
  for (let i = 0; i < 2 + ((h >> 8) % 3); i++) {
    const x = 50 + (((h >> (10 + i * 3)) % 9) - 4) * 6, y = 22 + ((h >> (12 + i * 2)) % 3) * 7;
    spots.push(`<ellipse cx="${x}" cy="${y}" rx="${4 + ((h >> i) % 3)}" ry="3.2" fill="#FFF8EC" opacity=".92"/>`);
  }
  return `<svg viewBox="0 0 100 80" aria-hidden="true">
    <ellipse cx="50" cy="75" rx="26" ry="4.5" fill="rgba(0,0,0,.28)"/>
    <path d="M41 44 Q38 64 35 74 L65 74 Q62 64 59 44 Z" fill="#F7EBD8" stroke="#0E1733" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="45" cy="58" rx="2.2" ry="3.4" fill="#0E1733"/><ellipse cx="55" cy="58" rx="2.2" ry="3.4" fill="#0E1733"/>
    <path d="M${50 - w - 6} 47 Q${50 - w} ${top} 50 ${top} Q${50 + w} ${top} ${50 + w + 6} 47 Q50 55 ${50 - w - 6} 47 Z"
      fill="color-mix(in srgb, var(--aspect) 80%, #fff)" stroke="#0E1733" stroke-width="3" stroke-linejoin="round"/>
    ${spots.join("")}</svg>`;
}

const SWORD = `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#F08A24" stroke="#0E1733" stroke-width="3"/>
  <path d="M8 32 L30 10 L34 6 L33 11 L11 33 Z" fill="#FFE2C2" opacity=".55"/></svg>`;
const HEART = `<svg viewBox="0 0 40 40"><path d="M20 35 C8 26 3 19 3 12.5 C3 7 7.5 3.5 12 3.5 C15.5 3.5 18.5 5.5 20 8.5 C21.5 5.5 24.5 3.5 28 3.5 C32.5 3.5 37 7 37 12.5 C37 19 32 26 20 35 Z" fill="#E8364F" stroke="#0E1733" stroke-width="3" stroke-linejoin="round"/></svg>`;

function abilityHtml(a) {
  // Bold the trigger ("When you play this unit,"), like the client.
  const t = esc(a.text);
  if (a.kind === "triggered") { const i = t.indexOf(", "); return `<b>${t.slice(0, i + 1)}</b>${t.slice(i + 1)}`; }
  return t;
}

function cardHtml(a) {
  const c = a.card || { name: "(no card)", type: a.card_type, cost: "?", power: "?", health: "?", aspect: "aspect_1", keywords: [], traits: [] };
  const kw = c.keywords.map((k) => `<b>${esc(k)}.</b>`).join(" ");
  const unit = c.type === "unit";
  return `<div class="card ${unit ? "" : "action"} ${a.stopped_at ? "stopped" : ""}" data-i="${a.index}"
      style="--aspect:${ASPECT_COLOURS[c.aspect] || NEUTRAL_COLOUR};--rim:#FFC93C" title="${esc(c.subtitle ? c.name + " – " + c.subtitle : c.name)}">
    <div class="art">${mushroom(c.name)}</div>
    <div class="gem"><span>${c.cost}</span></div>
    <div class="banner">${esc(c.name)}${c.subtitle ? `<small>${esc(c.subtitle)}</small>` : ""}</div>
    <div class="textbox"><div>${kw ? kw + "<br>" : ""}${abilityHtml(a)}</div></div>
    ${unit && c.traits.length ? `<div class="trait">${esc(c.traits[0])}</div>` : `<div class="trait">Action</div>`}
    ${unit ? `<div class="stat power">${SWORD}<span>${c.power}</span></div><div class="stat health">${HEART}<span>${c.health}</span></div>` : ""}
  </div>`;
}

function fitText(root) {
  // Shrink text in steps until it fits, as the client does (11.5 → 8.5 px at full size).
  const fit = (selector, steps, fits) => root.querySelectorAll(selector).forEach((el) => {
    const base = parseFloat(getComputedStyle(el.closest(".card")).fontSize);
    for (const step of steps) {
      el.style.fontSize = base * step + "px";
      if (fits(el)) break;
    }
  });
  fit(".card .textbox", [1.15, 1.05, 0.95, 0.85, 0.78, 0.72, 0.66, 0.6], (el) => el.scrollHeight <= el.clientHeight + 1);
  fit(".card .banner", [1.3, 1.15, 1.02, 0.92, 0.84], (el) => el.scrollWidth <= el.clientWidth + 1);
  fit(".card .banner small", [0.82, 0.74, 0.66, 0.6], (el) => el.scrollWidth <= el.clientWidth + 1);
}
</script>
