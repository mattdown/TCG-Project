<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Generation Visualiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Outfit:wght@500;700;800&display=swap">
<style>
/* The Lantern look (docs/client-design.md): night glass over the forest, Firefly for the path taken. */
:root {
  --shadow: #06100D; --night: #0B1612; --glass: #091310; --lantern: #7EF0D8; --text: #E6FBF4;
  --gold: #F4C76B; --muted: #A9C9BC; --parchment: #4A3726; --ink: #1C1209;
}
html, body { margin: 0; height: 100%; background: #050C0A; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  background: var(--night); font-family: Outfit, system-ui, sans-serif; }
#bg { position: absolute; inset: -30px; background: center / cover no-repeat; filter: blur(7px) brightness(.32) saturate(.85); }
#bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 38% 48%, rgba(11, 22, 18, .1) 0%, rgba(5, 12, 10, .75) 100%); }
#world { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.dlabel { font: 400 25px "Marcellus SC", serif; fill: var(--text); paint-order: stroke; stroke: var(--shadow); stroke-width: 6px; }
.opt { font-family: Outfit, system-ui; font-weight: 500; fill: #BFD8CE; paint-order: stroke; stroke: var(--shadow); stroke-width: 5px; }
.opt.chosen { fill: #fff; font-weight: 800; }
.opt .p { fill: var(--gold); }
.shade { position: absolute; left: 0; right: 0; pointer-events: none; }
.shade.top { top: 0; height: 230px; background: linear-gradient(rgba(6, 14, 11, .95) 30%, rgba(6, 14, 11, 0)); }
.shade.bottom { bottom: 0; height: 300px; background: linear-gradient(rgba(5, 12, 10, 0), rgba(5, 12, 10, .97) 65%); }
.title { position: absolute; left: 64px; top: 50px; font: 400 54px/1 "Marcellus SC", serif; color: var(--text); text-shadow: 0 3px 10px var(--shadow); }
.title small { display: block; margin-top: 14px; font: 500 24px/1.3 Outfit; color: var(--muted); text-shadow: none; }
.caption { position: absolute; left: 64px; bottom: 56px; max-width: 1150px; }
.crumbs { font: 700 18px Outfit; color: var(--lantern); letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.what { font: 400 50px/1.15 "Marcellus SC", serif; color: var(--text); margin: 6px 0 8px; text-shadow: 0 3px 10px var(--shadow); }
.what .arrow { color: var(--gold); }
.how { font: 500 24px Outfit; color: var(--muted); }
.odds { position: absolute; right: 64px; bottom: 56px; text-align: right; }
.odds .n { font: 800 46px/1.1 Outfit; color: var(--gold); text-shadow: 0 2px 8px var(--shadow); }
.odds .l { font: 500 21px Outfit; color: var(--muted); }
#cardbox { position: absolute; left: 1332px; top: 150px; width: 420px; }
.shade.right { left: auto; top: 0; bottom: 0; width: 780px; background: linear-gradient(90deg, rgba(6, 14, 11, 0), rgba(6, 14, 11, .9) 40%); }
.final { position: absolute; left: 1200px; width: 680px; top: 800px; text-align: center; }
.final .n { font: 800 62px/1.1 Outfit; color: var(--gold); text-shadow: 0 2px 10px var(--shadow); }
.final .l { font: 500 22px Outfit; color: var(--muted); }
/* The tests the card passed (card_lab._checks), where the caption was, once the path is done. */
.checks { position: absolute; left: 64px; bottom: 56px; max-width: 1100px; }
.checks .crumbs { margin-bottom: 12px; }
.checks ul { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; list-style: none; }
.checks li { padding: 6px 16px 6px 12px; border-radius: 999px; background: rgba(9, 19, 16, .8); border: 1.5px solid rgba(126, 240, 216, .45);
  font: 500 20px Outfit; color: var(--text); white-space: nowrap; }
.checks li::before { content: "✓"; margin-right: 8px; font-weight: 800; color: var(--lantern); }
.checks li.failed { border-color: rgba(255, 106, 92, .6); }
.checks li.failed::before { content: "✗"; color: #FF6A5C; }
#controls { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; background: var(--glass); border-top: 1.5px solid rgba(160, 235, 215, .3);
  display: flex; align-items: center; gap: 14px; padding: 0 16px; color: var(--muted); font: 500 14px Outfit, system-ui; }
#controls button { font: 400 15px "Marcellus SC", serif; background: var(--glass); color: var(--lantern); border: 1.5px solid var(--lantern);
  border-radius: 999px; padding: 5px 16px; cursor: pointer; }
#controls #new { min-width: 112px; }  /* the same width as "Skip" and "New card" */
#controls button:active { background: rgba(126, 240, 216, .18); transform: scale(.95); }
#controls input { flex: 1; min-width: 0; accent-color: var(--lantern); }  /* a range input won't shrink below ~130 px otherwise */
@media (max-width: 480px) { #controls { gap: 8px; padding: 0 10px; } #controls button { padding: 5px 11px; } #controls #new { min-width: 0; } #controls .seed { width: auto; } }
#controls .seed { width: 64px; color: var(--muted); }
body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <svg id="world" xmlns="http://www.w3.org/2000/svg"><g id="cam"></g></svg>
  <div class="shade right"></div><div class="shade top"></div><div class="shade bottom" id="shade-bottom"></div>
  <div class="title">One card, drawn from the grammar<small id="subtitle"></small></div>
  <div class="caption" id="caption"><div class="crumbs" id="crumbs"></div><div class="what" id="what"></div><div class="how" id="how"></div></div>
  <div class="odds" id="odds"><div class="n" id="odds-n"></div><div class="l">chance of this card so far</div></div>
  <div id="cardbox"></div>
  <div class="final" id="final"><div class="n" id="final-n"></div><div class="l">chance of generating this exact card (excluding name)</div></div>
  <div class="checks" id="checks"><div class="crumbs">Tests the card passed</div><ul id="check-list"></ul></div>
</div>
<div id="controls">
  <button id="play">Play</button>
  <button id="new">New card</button>
  <span class="seed" id="seed"></span>
  <input id="scrub" type="range" min="0" step="0.001" value="0">
</div>

<!--CARD_KIT-->
<!--PAINTED_CARD-->
<!--CARD_ART-->
<!--LAB_DATA-->
<script>
// The timeline: the card's derivation (src/cards/trace.py) laid out as a tree, one beat per decision.
// Everything on screen is a function of the time t, so the page and the rendered video match frame for frame.
const CARDS = window.LAB_DATA.cards;  // the set's first N cards, in order: "New card" picks from them
let CARD, A, STAGES;  // the card on show: its entry, its attempt (with trace) and its text stages
const W = 1920, H = 1080, NS = "http://www.w3.org/2000/svg";
const INTRO = 0.6, OUTRO = 3.6;
const STEP = 2.0;  // seconds per decision, the ability's and the card's alike
const SHOW_ODDS = true;  // the running "1 in N" and the final odds under the card
let PATH_END = 0, DURATION = 0;  // set by time(): the video is as long as the card's path needs
const FAN = 175, FORK = 620;  // option stub length, gap between the branches of a "choose one"
const MAX_FAN = 18;  // longer lists (action names) show this many options around the chosen one, then "+N more"
const NAME_DECISIONS = ["Species", "Action name", "Name after", "Subtitle"];  // left out of the odds

const ASPECTS = { aspect_1: "Ember", aspect_2: "Bog", aspect_3: "Moss", aspect_4: "Meadow", aspect_5: "Glow", aspect_6: "Frost" };
const NICE = { ...ASPECTS, on_play: "when played", on_attack_hero: "attacks the enemy hero", on_attack: "attacks",
  on_defeated: "is defeated", start_of_turn: "start of your turn", end_of_turn: "end of your turn",
  another_played: "you play another", opposing_defeated: "an enemy is defeated", follow_up: "follow-up",
  choose_one: "choose one", on_resolve: "on resolve", gain_crystal: "gain a mana crystal", deal_damage: "deal damage",
  remove_damage: "remove damage", return_to_hand: "return to hand", modify_stat: "change a stat",
  grant_keyword: "grant a keyword", heal_hero: "heal your hero", damage_hero: "damage a hero", damage_own: "damage your unit" };
const SECTIONS = { card: "Card", ability: "Ability", trigger: "Trigger", condition: "Condition", steps: "Steps",
  effect: "Effect", target: "Target", static: "Static ability" };
const pretty = (s) => NICE[s] || String(s).replace(/_/g, " ");
const sectionName = (s) => SECTIONS[s] || s.replace(/^./, (c) => c.toUpperCase());
const pct = (p) => (p >= 0.995 ? "100%" : p >= 0.1 ? Math.round(p * 100) + "%" : (p * 100).toFixed(1) + "%");
function oneIn(p) {
  const n = 1 / p;
  if (n < 10000) return "1 in " + Math.round(n).toLocaleString("en");
  for (const [v, w] of [[1e12, " trillion"], [1e9, " billion"], [1e6, " million"]]) if (n >= v) return "1 in " + (n / v).toFixed(1) + w;
  return "1 in " + Math.round(n).toLocaleString("en");
}
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const mix = (a, b, x) => "rgb(" + [0, 1, 2].map((i) => Math.round(lerp(a[i], b[i], x))).join(",") + ")";
const MUTED = [118, 150, 138], UNWALKED = [176, 214, 200], GOLD = [244, 199, 107];

const measure = document.createElement("canvas").getContext("2d");
function textWidth(text, px, weight = 500) {
  measure.font = `${weight} ${px}px Outfit`;
  return measure.measureText(text).width;
}

// ------------------------------------------------------------------ layout
let beats = [], links = [];
let bounds = { x0: 0, x1: 0, y0: 0, y1: 0 };  // both trees: the final shot
let pending = [];  // beats whose chosen option links to the next decision placed
let sectionEnd = {};  // section path ("ability/steps/option 1") → index of the last decision in it

function grow(x, y) {
  bounds.x0 = Math.min(bounds.x0, x); bounds.x1 = Math.max(bounds.x1, x);
  bounds.y0 = Math.min(bounds.y0, y); bounds.y1 = Math.max(bounds.y1, y);
}
const hasDecisions = (n) => n.children.some((c) => "decision" in c || hasDecisions(c));
const gapFor = (n) => (n > 1 ? Math.min(54, 480 / (n - 1)) : 0);
const slots = (n) => Math.min(n, MAX_FAN);  // rows a fan takes on screen
const titleRise = (span) => Math.max(54, span / 2 + 40);  // a decision's title sits this far above its node

function headroom(sec) {
  // How far the tallest fan and its title reach above its node: room to leave above a tree.
  return Math.max(0, ...sec.children.map((c) => ("decision" in c
    ? titleRise((slots(c.options.length) - 1) * gapFor(slots(c.options.length))) + 30 : headroom(c))));
}

function shown(d) {
  // The options drawn: all of them, or for a long list a window around the chosen one and a last row for the rest.
  const n = d.options.length;
  if (n <= MAX_FAN) return { options: d.options, more: 0 };
  const k = d.options.findIndex((o) => o.name === d.chosen);
  const start = Math.max(0, Math.min(n - (MAX_FAN - 1), k - Math.floor((MAX_FAN - 1) / 2)));
  return { options: d.options.slice(start, start + MAX_FAN - 1), more: n - (MAX_FAN - 1) };
}

function place(d, pt, crumbs, inAbility) {
  const n = d.options.length, open = d.options.filter((o) => o.p > 0);
  const { options, more } = shown(d), rows = slots(n);
  const size = rows > 12 ? 14 : rows > 7 ? 17 : 20;
  const gap = gapFor(rows);
  const chosen = d.options.find((o) => o.name === d.chosen);
  const b = { d, x: pt.x, y: pt.y, crumbs, inAbility, n, size, gap, open: open.length, forced: open.length <= 1,
    p: chosen.p, i: beats.length, options, more, named: NAME_DECISIONS.includes(d.decision) };
  const row = (k) => ({ x: pt.x + FAN, y: pt.y + (k - (rows - 1) / 2) * gap });
  b.ends = options.map((o, k) => row(k));
  if (more) b.moreAt = row(rows - 1);
  b.chosenEnd = b.ends[options.indexOf(chosen)];
  const labelW = Math.max(...options.map((o) => textWidth(pretty(o.name), size)));
  const chosenW = textWidth(pretty(d.chosen) + "  " + pct(chosen.p), size, 800);
  b.span = (rows - 1) * gap;
  grow(pt.x - 60, pt.y - titleRise(b.span) - 30); grow(pt.x + FAN + labelW + 90, pt.y + b.span / 2 + 20);
  for (const from of pending) links.push({ from, to: b });
  beats.push(b);
  for (let k = 1; k <= crumbs.length; k++) sectionEnd[crumbs.slice(0, k).join("/")] = b.i;
  pending = [b];
  return { x: pt.x + FAN + Math.max(130, chosenW + 50, n > 1 ? labelW * 0.55 + 60 : 0), y: pt.y };
}

function walk(sec, pt, crumbs, inAbility) {
  const kids = sec.children.filter((c) => "decision" in c || hasDecisions(c));
  for (let i = 0; i < kids.length;) {
    const c = kids[i];
    if ("decision" in c) { pt = place(c, pt, crumbs, inAbility); i++; continue; }
    if (/^option /.test(c.section)) {  // "choose one": the options fork, then join again
      const group = [];
      while (i < kids.length && /^option /.test(kids[i].section || "")) group.push(kids[i++]);
      const before = pending, ends = [];
      let x = pt.x;
      group.forEach((g, k) => {
        pending = before;
        const end = walk(g, { x: pt.x + 40, y: pt.y + (k - (group.length - 1) / 2) * FORK }, [...crumbs, g.section], inAbility);
        ends.push(...pending);
        x = Math.max(x, end.x);
      });
      pending = ends;
      pt = { x, y: pt.y };
      continue;
    }
    if (c.section === "card" && !crumbs.length) {  // building the card: its own tree, below the ability's
      pending = [];
      walk(c, { x: 0, y: bounds.y1 + 90 + headroom(c) }, [c.section], false);
      i++;
      continue;
    }
    pt = walk(c, pt, [...crumbs, c.section], inAbility || c.section === "ability");
    i++;
  }
  return pt;
}

// ------------------------------------------------------------------ timing
function time() {
  let t = INTRO;
  for (const b of beats) { b.t0 = t; t += STEP; b.t1 = t; }
  PATH_END = t;
  DURATION = window.DURATION = t + OUTRO;
}
const beatU = (b, t) => clamp((t - b.t0) / (b.t1 - b.t0));

// ------------------------------------------------------------------ drawing
const cam = document.getElementById("cam");
function svg(tag, attrs, parent = cam) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
const curve = (x0, y0, x1, y1) => `M${x0} ${y0} C${(x0 + x1) / 2} ${y0} ${(x0 + x1) / 2} ${y1} ${x1} ${y1}`;

function build() {
  const linkLayer = svg("g", {}), optLayer = svg("g", {}), nodeLayer = svg("g", {});
  for (const l of links) {
    const { from, to } = l;
    const x0 = from.chosenEnd.x + 4, y0 = from.chosenEnd.y;
    l.path = svg("path", { d: curve(x0, y0, to.x - 12, to.y), fill: "none", stroke: "rgb(244,199,107)",
      "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": 1 }, linkLayer);
  }
  for (const b of beats) {
    const opts = svg("g", {}, optLayer), nodes = svg("g", {}, nodeLayer);
    b.opts = b.options.map((o, k) => {
      const end = b.ends[k], chosen = o.name === b.d.chosen, closed = o.p === 0;
      const width = closed ? 2 : 2 + 14 * o.p;  // on screen, in pixels: draw() divides by the zoom
      const line = svg("path", { d: curve(b.x + 10, b.y, end.x, end.y), fill: "none", stroke: mix(MUTED, MUTED, 0),
        "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": closed ? "0.012 0.03" : 1 }, opts);
      const label = svg("text", { class: "opt" + (chosen ? " chosen" : ""), x: end.x + 10,
        y: chosen && b.n > 1 && b.gap >= 40 ? end.y - 10 : end.y + b.size * 0.35, "font-size": b.size }, opts);
      label.textContent = pretty(o.name);
      let chip = null;
      if (chosen && !b.forced) {
        chip = svg("tspan", { class: "p", dx: 8 }, label);
        chip.textContent = pct(o.p);
      }
      return { line, label, chip, chosen, closed, width };
    });
    if (b.more) {  // the rest of a long list: a faint row, faded like the options not taken
      const end = b.moreAt;
      const line = svg("path", { d: curve(b.x + 10, b.y, end.x, end.y), fill: "none", stroke: mix(MUTED, MUTED, 0),
        "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": "0.012 0.03" }, opts);
      const label = svg("text", { class: "opt", x: end.x + 10, y: end.y + b.size * 0.35, "font-size": b.size,
        "font-style": "italic" }, opts);
      label.textContent = `+${b.more} more`;
      b.opts.push({ line, label, chip: null, chosen: false, closed: true, width: 2 });
    }
    b.node = svg("circle", { cx: b.x, cy: b.y, fill: "#F4C76B", stroke: "#06100D" }, nodes);
    b.title = svg("text", { class: "dlabel", x: b.x, y: b.y - titleRise(b.span), "text-anchor": "middle" }, nodes);
    b.title.textContent = b.d.decision;
  }
}

// ------------------------------------------------------------------ camera
function zoomFor(b) { return Math.min(1.75, (H * 0.62) / (b.span + 190)); }
function focusOf(b) { return { x: b.x + FAN * 0.7, y: b.y, z: zoomFor(b), sx: 660, sy: H * 0.47 }; }  // left of the card
function fitAll() {
  const bw = bounds.x1 - bounds.x0, bh = bounds.y1 - bounds.y0;
  return { x: (bounds.x0 + bounds.x1) / 2, y: (bounds.y0 + bounds.y1) / 2,
    z: Math.min(1120 / bw, 680 / bh), sx: 660, sy: 520 };  // above the checklist
}
function blend(a, b, x) {
  return { x: lerp(a.x, b.x, x), y: lerp(a.y, b.y, x), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), x)),
    sx: lerp(a.sx, b.sx, x), sy: lerp(a.sy, b.sy, x) };
}
function camera(t) {
  const end = PATH_END;
  let c;
  if (t < INTRO) {
    const f = focusOf(beats[0]);
    c = { ...f, z: f.z * lerp(0.7, 1, ease(clamp(t / INTRO))) };
  } else if (t < end) {
    const i = beats.findIndex((b) => t < b.t1), b = beats[i < 0 ? beats.length - 1 : i];
    const u = beatU(b, t), next = beats[b.i + 1];
    c = focusOf(b);
    if (next && u > 0.6) {
      const s = ease((u - 0.6) / 0.4), n = focusOf(next);
      c = blend(c, n, s);
      // Pull back on long moves; on the jump to the card's tree, as far as the overview, so both trees stay in view.
      const dist = Math.hypot(n.x - b.x, n.y - b.y), arc = Math.sin(Math.PI * s);
      c.z *= 1 - 0.38 * Math.min(1, dist / 900) * arc;
      const jump = clamp((dist - 1500) / 1500) * arc;
      if (jump > 0) c.z = Math.exp(lerp(Math.log(c.z), Math.log(fitAll().z * 1.15), jump));
    }
  } else {
    c = blend(focusOf(beats[beats.length - 1]), fitAll(), ease(clamp((t - end) / 1.6)));
  }
  cam.setAttribute("transform", `translate(${c.sx - c.x * c.z} ${c.sy - c.y * c.z}) scale(${c.z})`);
  return c.z;
}

// ------------------------------------------------------------------ one frame
const $ = (id) => document.getElementById(id);
let captionKey = "";

function draw(t) {
  const end = PATH_END, outro = ease(clamp((t - end) / 1.2));
  const words = 1 - ease(clamp((t - end) / 0.5));  // text goes first, so the zoomed-out tree is only connections
  const z = camera(t), px = (n) => n / z;  // strokes keep their width on screen as the camera zooms
  for (const b of beats) {
    const u = beatU(b, t), on = t >= b.t0;
    const appear = on ? ease(clamp(u / 0.12)) : 0;
    const spread = ease(clamp(u / 0.35)), pick = ease(clamp((u - 0.35) / 0.25));
    b.node.style.opacity = appear;
    b.node.setAttribute("r", px(lerp(17, 10, outro)));
    b.node.style.strokeWidth = px(4);
    b.title.style.opacity = appear * words;
    for (const o of b.opts) {
      o.line.style.strokeWidth = px(o.width);
      if (o.closed) {
        o.line.style.opacity = 0.35 * spread * (1 - pick * 0.5) * (1 - outro);
        o.label.style.opacity = 0.32 * spread * words;
        continue;
      }
      o.line.style.strokeDashoffset = 1 - spread;
      if (o.chosen) {
        o.line.style.stroke = mix(MUTED, GOLD, pick);
        o.line.style.strokeWidth = px(lerp(o.width, 8, pick));
        o.line.style.opacity = spread > 0 ? 1 : 0;  // a round cap would show as a dot before the line starts
        o.label.style.opacity = clamp((spread - 0.5) / 0.5) * words;
        if (o.chip) o.chip.style.opacity = pick;
      } else {
        // Paths not taken dim once the choice is made, then brighten in the final shot: the size of the tree.
        const fade = lerp(lerp(1, 0.32, pick), 0.85, outro);
        o.line.style.opacity = spread > 0 ? fade : 0;
        o.line.style.stroke = mix(MUTED, UNWALKED, outro);
        o.line.style.strokeWidth = px(lerp(o.width, Math.max(o.width, 3.5), outro));
        o.label.style.opacity = clamp((spread - 0.5) / 0.5) * fade * words;
      }
    }
  }
  for (const l of links) {
    const b = beats[l.to.i - 1];
    const v = ease(clamp((beatU(b, t) - 0.6) / 0.4));
    l.path.style.strokeDashoffset = 1 - v;
    l.path.style.opacity = v > 0 ? 1 : 0;
    l.path.style.strokeWidth = px(8);
  }
  caption(t, 1 - words);
  odds(t, outro);
  finale(t);
  cardAt(t);
}

function caption(t, outro) {
  const b = beats.filter((x) => t >= x.t0).pop() || beats[0];
  const picked = beatU(b, t) >= 0.4;
  const key = b.i + ":" + picked;
  $("caption").style.opacity = ease(clamp(t / 0.4)) * (1 - outro);
  $("shade-bottom").style.opacity = 1 - outro;
  if (key === captionKey) return;
  captionKey = key;
  $("crumbs").textContent = b.crumbs.length ? b.crumbs.map(sectionName).join("  ›  ") : "Card";
  $("what").innerHTML = `${esc(b.d.decision)} <span class="arrow">→</span> ${picked ? esc(pretty(b.d.chosen)) : "…"}`;
  $("how").textContent = b.forced ? (b.d.note ? "forced: " + b.d.note : "forced: the only option here")
    : `${b.n} options` + (picked ? ` · took one with ${pct(b.p)}` : "");
}

function odds(t, outro) {
  let p = 1;
  for (const b of beats) if (!b.named && beatU(b, t) >= 0.5) p *= b.p;
  $("odds").style.opacity = SHOW_ODDS && p < 1 ? 1 - outro : 0;
  $("odds-n").textContent = oneIn(p);
}

function finale(t) {
  $("final").style.opacity = SHOW_ODDS ? ease(clamp((t - PATH_END - 1.9) / 0.5)) : 0;
  $("checks").style.opacity = ease(clamp((t - PATH_END - 2.3) / 0.5));
}

// ------------------------------------------------------------------ the card, filled in as the tree unfolds
const KEYWORD_DECISIONS = ["Add a keyword?", "Two keywords?", "Keyword", "Keyword value"];
let cardEvents = [], cardShown = -1;

function cardTimeline() {
  // Each decision that settles part of the card fills it in at the moment its choice is made. The
  // ability text comes in stages (card_generation_visualiser.py): each once its part of the tree is decided.
  const c = A.card, at = (b) => b.t0 + 0.6 * (b.t1 - b.t0);
  const lastKeyword = beats.filter((b) => KEYWORD_DECISIONS.includes(b.d.decision)).pop();
  const events = [];
  for (const b of beats) {
    const v = b.d.chosen, set = (f) => events.push({ t: at(b), f });
    switch (b.d.decision) {
      case "Card type": set((s) => { s.type = v; }); break;
      case "Job": set((s) => { s.traits = [v]; }); break;
      case "Aspect": set((s) => { s.aspect = v; }); break;
      case "Species": case "Action name": set((s) => { s.name = c.name; s.art = true; }); break;
      case "Subtitle": set((s) => { s.subtitle = c.subtitle; }); break;
      case "Starting cost": case "Cost": set((s) => { s.cost = v; }); break;
      case "Stats": set((s) => { s.power = c.power; s.health = c.health; }); break;
    }
    if (b === lastKeyword) set((s) => { s.keywords = c.keywords; });
  }
  for (const stage of STAGES) {
    const b = beats[sectionEnd[stage.after.join("/")]];
    if (b) events.push({ t: at(b), f: (s) => { s.text = stage.text; } });
  }
  cardEvents = events.sort((x, y) => x.t - y.t);
}

function cardAt(t) {
  const done = cardEvents.filter((e) => e.t <= t);
  if (done.length !== cardShown) {
    cardShown = done.length;
    const s = { type: "unit", name: "", subtitle: "", cost: "", power: "", health: "", aspect: null, keywords: [],
      traits: [""], text: "", art: false };
    for (const e of done) e.f(s);
    $("cardbox").innerHTML = paintedCard(s, A.kind, CARD.art);
    fitPainted($("cardbox"));
  }
  // A gold glow when something on the card has just been decided.
  const since = done.length ? t - done[done.length - 1].t : Infinity, glow = since < 0.7 ? 1 - since / 0.7 : 0;
  $("cardbox").style.filter = glow ? `drop-shadow(0 0 ${32 * glow}px rgba(244, 199, 107, ${0.9 * glow}))` : "none";
}

// ------------------------------------------------------------------ setup and playback
function fitStage() {
  const render = document.body.classList.contains("render");
  const room = { w: innerWidth, h: innerHeight - (render ? 0 : 52) };
  const s = render ? 1 : Math.min(room.w / W, room.h / H);
  const stage = $("stage");
  stage.style.transform = `translate(${(room.w - W * s) / 2}px, ${(room.h - H * s) / 2}px) scale(${s})`;
}

let now = 0, playing = false, last = 0;
function seek(t) {
  now = Math.max(0, Math.min(DURATION, t));
  draw(now);
  $("scrub").value = now;
  labels();
}
function labels() {
  // While the card plays, "New card" skips to its end, so the cards can be flicked through quickly.
  $("play").textContent = playing ? "Pause" : "Play";
  $("new").textContent = playing && now < DURATION ? "Skip" : "New card";
}
window.seek = seek;

function tick(ms) {
  if (!playing) return;
  seek(now + (ms - last) / 1000);
  last = ms;
  if (now >= DURATION) { playing = false; labels(); return; }
  requestAnimationFrame(tick);
}
function toggle() {
  playing = !playing;
  labels();
  if (playing) {
    if (now >= DURATION) seek(0);
    last = performance.now();
    requestAnimationFrame(tick);
  }
}

function load(data) {
  // Lay out one card's tree and timeline from scratch, replacing whatever was on show.
  CARD = data; A = data.kept; STAGES = data.text_stages || [];
  beats = []; links = []; pending = []; sectionEnd = {}; bounds = { x0: 0, x1: 0, y0: 0, y1: 0 };
  cam.replaceChildren();
  captionKey = ""; cardShown = -1;
  walk(A.trace, { x: 0, y: 0 }, [], false);
  time();
  build();
  cardTimeline();
  $("check-list").innerHTML = A.checks.map((c) => `<li class="${c.problems.length ? "failed" : ""}">${esc(c.name)}</li>`).join("");
  $("final-n").textContent = oneIn(beats.filter((b) => !b.named).reduce((p, b) => p * b.p, 1));
  $("seed").textContent = `S1-${String(data.number).padStart(3, "0")}`;
  $("scrub").max = DURATION;
  seek(0);
}

function skipOrNew() {
  if (playing && now < DURATION) { playing = false; seek(DURATION); } else newCard();
}

// "New card" works through the pool in a shuffled order, so cards don't repeat until it runs out.
let order = [], shownCard = 0;
function newCard() {
  if (!order.length) order = CARDS.map((_, i) => i).filter((i) => i !== shownCard).sort(() => Math.random() - 0.5);
  shownCard = order.pop();
  history.replaceState(null, "", "?card=" + CARDS[shownCard].number);
  load(CARDS[shownCard]);
  if (!playing) toggle();
}

async function init() {
  const query = new URLSearchParams(location.search);
  if (query.has("render")) document.body.classList.add("render");
  await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 3000))]);
  $("subtitle").textContent = "Every random choice the generator made, and the card they add up to";
  if (!SHOW_ODDS) $("cardbox").style.top = (H - 420 * 210 / 151.24) / 2 + "px";  // nothing under it: centre it
  const first = query.get("card") || window.LAB_DATA.first;  // a shared link's card, or --card
  shownCard = Math.max(0, CARDS.findIndex((c) => String(c.number) === String(first)));
  $("bg").style.backgroundImage = `url(${window.CARD_ART.background})`;
  load(CARDS[shownCard]);
  $("new").addEventListener("click", skipOrNew);
  $("scrub").addEventListener("input", (e) => { playing = false; seek(+e.target.value); });
  $("play").addEventListener("click", toggle);
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    if (e.code === "ArrowRight") seek(now + 1 / 60);
    if (e.code === "ArrowLeft") seek(now - 1 / 60);
  });
  addEventListener("resize", fitStage);
  fitStage();
  window.ready = true;
}
init();
</script>
</body>
</html>
