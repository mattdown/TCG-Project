[project]
name = "tcg-project"
version = "0.1.0"
description = "Self-play and GNN training to design a balanced set of trading card game cards"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.2",
    "pyzmq>=27.1.0",
    "torch>=2.8.0",
    "torch-geometric>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:`torch.jit.script` is deprecated:FutureWarning"]
