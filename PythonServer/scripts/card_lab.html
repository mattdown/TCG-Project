<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root {
  --outline: #0E1733; --panel: #16203D; --bg: #1E2C55; --bg-deep: #141E3F; --light: #E9EEF8;
  --energy: #E24BD6; --power: #F08A24; --health: #E8364F; --gold: #FFC93C; --gold-lip: #D98A10;
  --good: #5BEA5B; --bad: #FF4D5E; --muted: #9AA8CF; --text: #F4F6FC;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-deep); color: var(--text); font: 700 15px/1.45 Nunito, system-ui, sans-serif; }
button, input { font: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font: 400 40px/1 "Lilita One", system-ui; margin: 0; letter-spacing: .5px; text-shadow: 0 3px 0 var(--outline); }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 720px; }
header { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.controls label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
.controls input { width: 84px; padding: 7px 9px; border-radius: 9px; border: 2px solid var(--outline); background: var(--panel); color: var(--text); }
.btn { font: 400 17px "Lilita One", system-ui; color: var(--outline); background: var(--gold); border: 2px solid var(--outline);
  border-radius: 11px; padding: 7px 16px; box-shadow: inset 0 -4px 0 var(--gold-lip); cursor: pointer; }
.btn.alt { background: #DDE4F5; box-shadow: inset 0 -4px 0 #A9B5D6; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--gold-lip); }
.note { font-size: 13px; color: var(--muted); }

.funnel { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 10px; align-items: stretch; }
.stage { flex: 1 1 120px; background: var(--panel); border: 2px solid var(--outline); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; color: inherit; }
.stage .n { font: 400 28px/1 "Lilita One", system-ui; }
.stage .l { font-size: 12px; color: var(--muted); }
.stage.drop .n { color: var(--bad); }
.stage.kept .n { color: var(--good); }
.stage[aria-pressed="true"] { border-color: var(--gold); }
.reasons { display: grid; grid-template-columns: max-content 1fr max-content; gap: 4px 12px; align-items: center; font-size: 13px; margin: 6px 0 22px; }
.bar { height: 10px; border-radius: 5px; background: var(--bad); opacity: .8; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.chip { border: 2px solid var(--outline); background: var(--panel); color: var(--text); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--outline); }
.search { flex: 1 1 180px; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--outline); background: var(--panel); color: var(--text); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 22px 14px; justify-items: center; }
.empty { color: var(--muted); padding: 30px 0; }

.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 12px; background: var(--panel); border: 2px solid var(--outline); border-radius: 12px; cursor: pointer; text-align: left; color: inherit; }
.row:hover { border-color: #3B4C85; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; border-radius: 6px; padding: 2px 6px; background: var(--bad); color: var(--outline); justify-self: start; align-self: start; font-weight: 900; }
.tag.variety { background: #8FA0D8; }
.row .why { color: #FF9AA5; font-size: 13px; }
.row .meta, .meta { color: var(--muted); font-size: 12px; }

/* Detail drawer */
.scrim { position: fixed; inset: 0; background: rgba(5, 9, 25, .55); opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); border-left: 3px solid var(--outline);
  transform: translateX(100%); transition: transform .18s; overflow-y: auto; padding: 20px 20px 40px; }
.drawer.open { transform: none; }
.drawer .close { position: absolute; right: 14px; top: 12px; }
.drawer h2 { font: 400 24px/1.1 "Lilita One"; margin: 0 52px 4px 0; }
.drawer h3 { font: 400 17px "Lilita One"; margin: 22px 0 8px; color: var(--gold); letter-spacing: .3px; }
.drawer .hero { display: flex; justify-content: center; padding: 18px 0 10px; }
.drawer .hero .card { --w: 230px; cursor: default; }
.drawer .hero .card:hover { transform: none; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { background: var(--panel); border-radius: 10px; padding: 8px 10px; border: 2px solid var(--outline); }
.checks .ok::before { content: "✓ "; color: var(--good); font-weight: 900; }
.checks .no::before { content: "✗ "; color: var(--bad); font-weight: 900; }
.checks .skip { color: var(--muted); }
.checks .skip::before { content: "· "; }
.checks small { display: block; color: #FF9AA5; font-size: 12.5px; margin-top: 2px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
pre { background: var(--outline); border-radius: 10px; padding: 12px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; color: #CFE0FF; margin: 0; }
.say { background: var(--light); color: var(--outline); border-radius: 10px; padding: 10px 12px; }
@media (max-width: 600px) { h1 { font-size: 32px; } .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } .card { --w: 150px; } }
</style>
<!--CARD_KIT-->
</head>
<body>
<!--LAB_DATA-->
<div class="wrap">
  <header>
    <div>
      <h1>Card Lab</h1>
      <p class="sub">Cards generated from scratch by an ability grammar: no example cards, no hand-picked templates.
        Each draw goes through the grammar, the quality tests and costing; you can see what was kept and what was thrown away, and why.</p>
    </div>
    <form class="controls" id="controls">
      <label>Seed <input name="seed" type="number" min="0"></label>
      <label>Cards <input name="count" type="number" min="1" max="500"></label>
      <label>Jobs <input name="jobs" type="number" min="1" max="20"></label>
      <label>Vanilla <input name="vanilla_share" type="number" min="0" max="1" step="0.01"></label>
      <label>Keyword-only <input name="keyword_share" type="number" min="0" max="1" step="0.05"></label>
      <label>Actions <input name="action_share" type="number" min="0" max="1" step="0.05"></label>
      <label>Variety <input name="variety" type="number" min="1" max="16"></label>
      <button class="btn" type="submit">Generate</button>
      <button class="btn alt" type="button" id="reroll">New seed</button>
      <a href="explorer" class="note" style="color:var(--gold);align-self:center">One card, step by step →</a>
    </form>
  </header>
  <p class="note" id="status"></p>

  <div class="funnel" id="funnel"></div>
  <div class="reasons" id="reasons"></div>

  <div class="toolbar" id="toolbar">
    <button class="chip" data-view="kept" aria-pressed="true">Kept cards</button>
    <button class="chip" data-view="stopped" aria-pressed="false">Thrown away</button>
    <span style="width:12px"></span>
    <button class="chip" data-kind="" aria-pressed="true">All</button>
    <button class="chip" data-kind="triggered" aria-pressed="false">Triggered</button>
    <button class="chip" data-kind="static" aria-pressed="false">Static</button>
    <button class="chip" data-kind="on_resolve" aria-pressed="false">Actions</button>
    <button class="chip" data-kind="keywords" aria-pressed="false">Keyword-only</button>
    <button class="chip" data-kind="vanilla" aria-pressed="false">Vanilla</button>
    <input class="search" id="search" type="search" placeholder="Search card text…">
  </div>
  <div id="results"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="btn alt close" id="close" type="button">✕</button>
  <div id="detail"></div>
</aside>

<script>
const STAGE_TEXT = {
  grammar: ["Grammar", "illegal trees"], quality: ["Quality", "complex, unconnected or fake choices"],
  card: ["Card", "couldn't matter or doesn't fit"], duplicate: ["Duplicate", "same stats as a card in the set"],
  variety: ["Variety", "too similar to earlier cards"],
};
const TEST_TEXT = {
  grammar: "Illegal under the grammar", complexity: "Too complex", connected: "Steps not connected",
  dominated: "Dominated choose-one option", card: "Couldn't matter on the card", variety: "Too similar to earlier cards",
  duplicate: "Duplicate stats",
};
const KIND_TEXT = { triggered: "Triggered ability", activated: "Activated ability", static: "Static ability",
  on_resolve: "Action", vanilla: "Vanilla", keywords: "Keyword-only" };

const state = { data: null, view: "kept", kind: "", stage: "", search: "", selected: null };
const $ = (id) => document.getElementById(id);

function firstFailure(a) { return a.checks.find((c) => c.problems.length); }

function renderSummary() {
  const d = state.data, atts = d.attempts, kept = new Set(d.kept);
  const by = (s) => atts.filter((a) => a.stopped_at === s).length;
  let html = `<button class="stage" data-stage="" aria-pressed="${state.stage === ""}"><div class="n">${atts.length}</div><div class="l">draws from the grammar</div></button>`;
  for (const s of d.stages) {
    html += `<button class="stage drop" data-stage="${s}" aria-pressed="${state.stage === s}"><div class="n">−${by(s)}</div><div class="l">${STAGE_TEXT[s][0]}: ${STAGE_TEXT[s][1]}</div></button>`;
  }
  html += `<div class="stage kept"><div class="n">${kept.size}</div><div class="l">cards kept</div></div>`;
  $("funnel").innerHTML = html;

  const counts = {};
  for (const a of atts) if (a.stopped_at) { const f = firstFailure(a); const k = f ? f.test : a.stopped_at; counts[k] = (counts[k] || 0) + 1; }
  const rows = Object.entries(counts).sort((x, y) => y[1] - x[1]);
  const max = Math.max(1, ...rows.map((r) => r[1]));
  $("reasons").innerHTML = rows.map(([k, n]) =>
    `<span>${TEST_TEXT[k] || k}</span><div class="bar" style="width:${(100 * n) / max}%"></div><span>${n}</span>`).join("");
  const p = d.params;
  $("status").textContent = `Seed ${p.seed} · ${p.count} cards · jobs: ${d.job_list.join(", ")} · ` +
    `complexity budget ${d.max_complexity} nodes · variety: best of ${p.variety}` + (window.LAB_DATA ? " · saved snapshot" : "");
}

function visible() {
  const d = state.data, kept = new Set(d.kept), q = state.search.toLowerCase();
  const pool = state.view === "kept" ? d.kept.map((i) => d.attempts[i]) : d.attempts.filter((a) => a.stopped_at && (!state.stage || a.stopped_at === state.stage));
  return pool.filter((a) => (!state.kind || a.kind === state.kind) &&
    (!q || a.text.toLowerCase().includes(q) || (a.card && (a.card.name + " " + a.card.subtitle).toLowerCase().includes(q))));
}

function renderResults() {
  const items = visible(), out = $("results");
  if (!items.length) { out.innerHTML = `<p class="empty">Nothing matches.</p>`; return; }
  if (state.view === "kept") {
    out.innerHTML = `<div class="grid">${items.map(cardHtml).join("")}</div>`;
  } else {
    out.innerHTML = `<div class="list">${items.map((a) => {
      const f = firstFailure(a);
      return `<button class="row" data-i="${a.index}"><span class="tag ${a.stopped_at}">${a.stopped_at}</span>
        <div><div>${esc(a.text || (a.card ? `${a.card.cost} mana ${a.card.power}/${a.card.health} ${a.card.keywords.join(", ")}` : ""))}</div><div class="why">${esc((f ? f.problems : a.problems).join("; "))}</div>
        <div class="meta">${KIND_TEXT[a.kind]}${a.tree ? ` · ${a.complexity} nodes` : ""}</div></div></button>`;
    }).join("")}</div>`;
  }
  fitText(out);
}

function renderDetail(i) {
  const a = state.data.attempts[i], c = a.card;
  const verdict = a.stopped_at ? `Thrown away at the ${a.stopped_at} stage` : "Kept";
  let checks = "", stopped = false;
  for (const ch of a.checks) {
    const bad = ch.problems.length > 0;
    checks += `<li class="${stopped ? "skip" : bad ? "no" : "ok"}">${esc(ch.name)}${bad ? ch.problems.map((p) => `<small>${esc(p)}</small>`).join("") : ""}</li>`;
    if (bad && ch.test === "grammar") stopped = true;
  }
  if (!a.checks.some((ch) => ch.test === "card")) checks += `<li class="skip">Card building and costing: not reached</li>`;
  const costing = c ? `<dl class="kv">
      <dt>Card type</dt><dd>${c.type}${c.archetype ? ` (${c.archetype})` : ""}</dd>
      ${a.tree ? `<dt>Ability value</dt><dd>${a.value} budget points (rough, from costing.py)</dd>` : ""}
      <dt>Cost</dt><dd>${c.cost} mana</dd>
      ${c.type === "unit" ? `<dt>Stats</dt><dd>${c.power} power · ${c.health} health</dd>` : ""}
      ${c.keywords.length ? `<dt>Keywords</dt><dd>${c.keywords.map(esc).join(", ")}</dd>` : ""}
      <dt>Aspect</dt><dd>${c.aspect_name}</dd></dl>` : `<p class="meta">Not reached: the card is only built once the ability passes the tests.</p>`;
  $("detail").innerHTML = `
    <h2>${esc(c ? c.name : "Draw #" + a.index)}</h2>${c && c.subtitle ? `<div class="meta" style="font-style:italic">${esc(c.subtitle)}</div>` : ""}
    <div class="meta">${verdict} · draw #${a.index} · ${KIND_TEXT[a.kind]}${a.tree ? ` · ${a.complexity} nodes` : ""}</div>
    ${c ? `<div class="hero">${cardHtml({ ...a, stopped_at: null })}</div>` : `<h3>Card text</h3><div class="say">${esc(a.text)}</div>`}
    <h3>Pipeline</h3><ul class="checks">${checks}</ul>
    <h3>Costing</h3>${costing}
    ${a.tree ? `<h3>Ability tree</h3><pre>${esc(JSON.stringify(a.tree, null, 2))}</pre>
    <h3>Shape</h3><p class="meta">The tree with numbers and jobs blanked out. The variety stage counts these.</p><pre>${esc(JSON.stringify(JSON.parse(a.shape)))}</pre>` : ""}`;
  fitText($("detail"));
  $("drawer").classList.add("open"); $("scrim").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false");
}

function closeDetail() { $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); }

function render() { renderSummary(); renderResults(); syncChips(); }

function syncChips() {
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  document.querySelectorAll("[data-kind]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === state.kind));
}

function params() { return Object.fromEntries(new FormData($("controls"))); }

function fillForm(p) { for (const [k, v] of Object.entries(p)) { const el = $("controls").elements[k]; if (el) el.value = v; } }

async function generate() {
  const p = params();
  $("status").textContent = "Generating…";
  history.replaceState(null, "", "#" + new URLSearchParams(p));
  const res = await fetch("/api/generate?" + new URLSearchParams(p));
  const data = await res.json();
  if (data.error) { $("status").textContent = data.error; return; }
  state.data = data; render();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-view],[data-kind],[data-stage],[data-i]");
  if (!t || $("drawer").contains(t)) return;
  if (t.dataset.view) { state.view = t.dataset.view; if (state.view === "kept") state.stage = ""; }
  else if (t.dataset.kind !== undefined) state.kind = t.dataset.kind;
  else if (t.dataset.stage !== undefined) { state.stage = t.dataset.stage; state.view = t.dataset.stage ? "stopped" : "kept"; }
  else { renderDetail(+t.dataset.i); return; }
  render();
});
// Fonts can finish loading after the first render, which changes how much text fits.
document.fonts.addEventListener("loadingdone", () => fitText(document));
$("search").addEventListener("input", (e) => { state.search = e.target.value; renderResults(); });
$("close").addEventListener("click", closeDetail);
$("scrim").addEventListener("click", closeDetail);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

if (window.LAB_DATA) {
  state.data = window.LAB_DATA;
  $("controls").style.display = "none";
  render();
} else {
  fillForm({ seed: 1, count: 60, jobs: 6, vanilla_share: 0.04, keyword_share: 0.25, action_share: 0.25, variety: 4, ...Object.fromEntries(new URLSearchParams(location.hash.slice(1))) });
  $("controls").addEventListener("submit", (e) => { e.preventDefault(); generate(); });
  $("reroll").addEventListener("click", () => { $("controls").elements.seed.value = Math.floor(Math.random() * 100000); generate(); });
  document.fonts.ready.then(generate);
}
</script>
</body>
</html>
